name: MHR Utilities (one file)

on:
  push:
    branches:
      - main
      - main_dev

env:
  VersionMarjor: 2
  VersionMinor: ${{ github.run_number }}
  # VersionBuild: ${{ github.run_id }}
  VersionBuild: 0
  VersionRevision: ${{ github.run_attempt }}
  ArtifactBaseName: MHR_Util
  BuildScript: build\scripts\buildExeOneFile.bat
  PrebuildScript: build\scripts\prebuild.py
  VersionFile: build\version_info.txt
  ArtifactFolder: dist\
  PythonRequirements: build\python_requirements.txt

jobs:
  build_release:
    runs-on: windows-latest

    steps:
      - name: Set Full Version
        run: |
          echo ("FullVersion=${{ env.VersionMarjor }}.${{ env.VersionMinor }}.${{ env.VersionBuild }}.${{ env.VersionRevision }}") >> $env:GITHUB_ENV

      - name: Set artifact name
        run: |
          echo ("ArtifactName=${{ env.ArtifactBaseName }}") >> $env:GITHUB_ENV

      - name: Set artifact path (one file)
        run: |
          echo ("ArtifactFullPath=${{ env.ArtifactFolder }}/${{ env.ArtifactName }}.exe") >> $env:GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4
        with: 
          fetch-depth: 1    

      - name: Read Python version
        id: python_version
        run: echo "PythonVersion=$(<.python-version)" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PythonVersion }}
          cache: 'pip'
          cache-dependency-path: ${{ env.PythonRequirements }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ env.PythonRequirements }}
          
      - name: Run prebuild
        run: |
          python "${{ env.PrebuildScript }}" "${{ env.ArtifactName }}" "${{ env.VersionMarjor }}" "${{ env.VersionMinor }}" "${{ env.VersionBuild }}" "${{ env.VersionRevision }}" ${{ env.VersionFile }}

      - name: Create EXE (one file)
        run: |
          .\${{ env.BuildScript }} "${{ env.ArtifactName }}" "${{ env.VersionFile }}"

      - name: Upload artifact (one file)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ArtifactName }} 
          path: |
            ${{ env.ArtifactFullPath }}

      # ============== Below are steps for only release branch (main) ================

      - name: Delete all (one file) releases and tags
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VersionBuild: ${{ env.VersionBuild }}
        run: |
          # Build regex dynamically based on VersionBuild
          $patch = [regex]::Escape($env:VersionBuild)
          $versionPattern = "^v\d+\.\d+\.$patch\.\d+$"
    
             Write-Host "Deleting releases with patch version $env:VersionBuild..."
    
             $releases = gh release list --limit 1000 --json tagName | ConvertFrom-Json
          foreach ($release in $releases) {
            if ($release.tagName -match $versionPattern) {
              Write-Host "Deleting release $($release.tagName)"
              gh release delete $release.tagName -y
            }
          }
    
             Write-Host "Deleting tags with patch version $env:VersionBuild..."
    
             git fetch --tags
          $tags = git tag
          foreach ($tag in $tags) {
            if ($tag -match $versionPattern) {
              Write-Host "Deleting tag $tag"
              git tag -d $tag
              git push origin :refs/tags/$tag
            }
          }

      - name: Create Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.FullVersion }}
          name: ${{ env.ArtifactName }} (Compressed)
          files: |
            ${{ env.ArtifactFullPath }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}          



