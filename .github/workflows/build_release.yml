name: MHR Utilities

on:
  push:
    branches:
      - main
      - main_release

env:
  VersionMarjor: 2
  VersionMinor: ${{ github.run_number }}
  VersionBuild: ${{ github.run_id }}
  VersionRevision: ${{ github.run_attempt }}
  ArtifactBaseName: MHR Util
  BuildScript: build\scripts\buildExe.bat
  PrebuildScript: build\scripts\prebuild.py
  VersionFile: build\version_info.txt
  PythonPath: python314\python.exe
  ArtifactFolder: dist\

jobs:
  build_release:
    runs-on: windows-latest

    steps:
      - name: Set artifact name
        run: |
          echo ("ArtifactName=${{ env.ArtifactBaseName }}") >> $env:GITHUB_ENV

      - name: Set artifact path
        run: |
          echo ("ArtifactFullPath=${{ env.ArtifactFolder }}/${{ env.ArtifactName }}.exe") >> $env:GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4
        with: 
          fetch-depth: 1         
          
      - name: Run prebuild
        run: |
          python314/python.exe "${{ env.PrebuildScript }}" "${{ env.ArtifactName }}" "${{ env.VersionMarjor }}" "${{ env.VersionMinor }}" "${{ env.VersionBuild }}" "${{ env.VersionRevision }}" ${{ env.VersionFile }}

      - name: Create EXE 
        run: |
          .\${{ env.BuildScript }} "${{ env.ArtifactName }}" "${{ env.PythonPath }}" 

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ArtifactName }}
          path: |
            ${{ env.ArtifactFullPath }}

      # ============== Below are steps for only release branch (main_release) ================

      - name: Delete all releases and tags
        if: github.ref == 'refs/heads/main_release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Write-Host "Deleting all releases..."
        
          $releases = gh release list --limit 1000 --json tagName | ConvertFrom-Json
          foreach ($release in $releases) {
            Write-Host "Deleting release $($release.tagName)"
            gh release delete $release.tagName -y
          }
        
          Write-Host "Deleting all tags..."
        
          git fetch --tags
          $tags = git tag
          foreach ($tag in $tags) {
            Write-Host "Deleting tag $tag"
            git tag -d $tag
            git push origin :refs/tags/$tag
          }

      - name: Create Release
        if: github.ref == 'refs/heads/main_release'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ env.VersionMinor }}.${{ env.VersionBuild }}.0.${{ env.VersionRevision }}
          name: ${{ env.ArtifactName }} Release
          files: |
            ${{ env.ArtifactFullPath }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}          



