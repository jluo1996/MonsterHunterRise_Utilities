name: MHR Utilities (one dir)

on:
  push:
    branches:
      - main
      - release/**

env:
  VersionMarjor: 2
  VersionMinor: ${{ github.run_number }}
  # VersionBuild: ${{ github.run_id }}
  VersionBuild: 1
  VersionRevision: ${{ github.run_attempt }}
  ArtifactBaseName: MHR_Util
  BuildScript: build\scripts\buildExeOneDir.bat
  PrebuildScript: build\scripts\prebuild.py
  VersionFile: build\version_info.txt
  ArtifactFolder: dist\
  PythonRequirements: build\python_requirements.txt
  PRERELEASE: ${{ !startsWith(github.ref_name, 'release/') }}

jobs:
  'build-MHR_Utilities':
    runs-on: windows-latest

    steps:
      - name: Set Full Version
        run: |
          echo ("FullVersion=${{ env.VersionMarjor }}.${{ env.VersionMinor }}.${{ env.VersionBuild }}.${{ env.VersionRevision }}") >> $env:GITHUB_ENV

      - name: Set artifact name
        run: |
          echo ("ArtifactName=${{ env.ArtifactBaseName }}") >> $env:GITHUB_ENV

      - name: Set artifact path (one dir)
        run: |
          echo ("ArtifactFullPath=${{ env.ArtifactFolder }}/${{ env.ArtifactName }}") >> $env:GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4
        with: 
          fetch-depth: 1         
       
      - name: Read Python version
        id: python_version
        shell: bash
        run: echo "PythonVersion=$(<.python-version)" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PythonVersion }}
          cache: 'pip'
          cache-dependency-path: ${{ env.PythonRequirements }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ env.PythonRequirements }}

      - name: Run prebuild
        run: |
          python "${{ env.PrebuildScript }}" "${{ env.ArtifactName }}" "${{ env.VersionMarjor }}" "${{ env.VersionMinor }}" "${{ env.VersionBuild }}" "${{ env.VersionRevision }}" ${{ env.VersionFile }}

      - name: Create EXE (one dir)
        run: |
          .\${{ env.BuildScript }} "${{ env.ArtifactName }}" "${{ env.VersionFile }}"

      - name: Upload artifact (one dir)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ArtifactName }} 
          path: |
            ${{ env.ArtifactFullPath }}

      - name: Build tag name
        if: ${{ env.PRERELEASE == 'true' }}
        run: |
          echo "FullVersion=${{ env.FullVersion }}-prerelease" >> $env:GITHUB_ENV
    
      - name: Zip artifact
        run: |
            Compress-Archive -Path "${{ env.ArtifactFullPath }}\*" -DestinationPath "${{ env.ArtifactFullPath }}.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.FullVersion }}
          generate_release_notes: true
          name: ${{ env.ArtifactName }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.PRERELEASE != 'true' }}
          files: |
            ${{ env.ArtifactFullPath }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}          

      - name: Delete pre-release
        if: ${{ env.PRERELEASE != 'true' }}
        uses: jluo1996/delete-releases-action@v1
        with:
            tag-pattern: "*-prerelease*"
            keep-latest: 0
            remove-tags: true
            repository: ${{ github.repository }}
            token: ${{ secrets.GITHUB_TOKEN }}
